services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberdb
      POSTGRES_USER: cyber
      POSTGRES_PASSWORD: cyberpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber -d cyberdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: docker-dev-secret-key-change-me
      DEBUG: "False"
      ALLOWED_HOSTS: "127.0.0.1,localhost,0.0.0.0,web"
      CSRF_TRUSTED_ORIGINS: "http://127.0.0.1,http://localhost"
      DATABASE_URL: "postgres://cyber:cyberpass@db:5432/cyberdb"
      REDIS_URL: "redis://redis:6379/0"
      SEED_ON_START: "0"
      TRAIN_ON_START: "0"
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --access-logfile -
      --error-logfile -

volumes:
  postgres_data: