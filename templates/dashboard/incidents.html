{% extends "base.html" %}

{% block title %}Incidents · CyberSecurity Dashboard{% endblock %}

{% block content %}
<h2 class="mb-4">Incidents</h2>

<div class="card">
    <div class="card-body p-0">
        <div class="table-scroll">
            <table class="table table-hover align-middle mb-0">
                <thead class="sticky-top">
                <tr>
                    <th>ID</th>
                    <th>Detected</th>
                    <th>Title</th>
                    <th>Severity</th>
                    <th>Status</th>
                    <th>Asset</th>
                    <th>Threat</th>
                    <th>Assigned</th>
                </tr>
                </thead>
                <tbody id="incident-rows">
                    <tr><td colspan="8" class="text-center py-4 text-muted">
                        Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
async function loadIncidents() {
    const data = await apiFetch('/api/incidents/?page_size=100');
    const tbody = document.getElementById('incident-rows');
    if (!data.results.length) {
        tbody.innerHTML = `<tr><td colspan="8"
            class="text-center py-4 text-muted">No incidents.</td></tr>`;
        return;
    }
    tbody.innerHTML = data.results.map(i => `
        <tr>
            <td class="mono">${i.id}</td>
            <td class="mono small">${new Date(i.detected_at).toLocaleString()}</td>
            <td>${i.title}</td>
            <td><span class="pill pill-${i.severity}">${i.severity}</span></td>
            <td><span class="pill pill-${i.status}">${i.status.replace('_',' ')}</span></td>
            <td class="small">${i.asset_name || '—'}</td>
            <td class="small">${i.threat_name || '—'}</td>
            <td class="small">${i.assigned_to || '—'}</td>
        </tr>
    `).join('');
}

document.addEventListener('DOMContentLoaded', loadIncidents);
</script>
{% endblock %}
